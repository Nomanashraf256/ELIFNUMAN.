<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Elif, from Numan</title>
<style>
  :root{
    --ink:#2b1620;
    --cream:#fbf1ea;
    --blush:#f6dce2;
    --rose-deep:#a3324a;
    --rose-mid:#c9506a;
    --rose-light:#e98da0;
    --leaf-deep:#33503f;
    --leaf-mid:#4c7059;
    --gold:#c9a367;
    --paper:#fffaf5;
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --body: 'Lora', Georgia, serif;
  }

  *{box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:var(--body);
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- language toggle ---------- */
  .lang-switch{
    position:fixed;
    top:1.4rem;
    right:1.4rem;
    z-index:20;
    display:flex;
    background:var(--paper);
    border-radius:999px;
    padding:.3rem;
    box-shadow:0 8px 20px rgba(90,30,45,.14);
  }
  .lang-switch button{
    font-family:var(--body);
    font-size:.85rem;
    border:none;
    background:transparent;
    color:#8a5c66;
    padding:.4rem .9rem;
    border-radius:999px;
    cursor:pointer;
    letter-spacing:.02em;
    transition:background .25s ease, color .25s ease;
  }
  .lang-switch button.active{
    background:var(--rose-deep);
    color:var(--cream);
  }
  .lang-switch button:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }

  /* ---------- falling petals ---------- */
  .petal-field{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    overflow:hidden;
  }
  .petal{
    position:absolute;
    top:-40px;
    width:14px;
    height:14px;
    background:var(--rose-light);
    border-radius:0 60% 0 60%;
    opacity:.65;
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0;}
    8%{ opacity:.7; }
    100%{ transform:translateY(110vh) translateX(var(--drift,40px)) rotate(320deg); opacity:0;}
  }

  @media (prefers-reduced-motion: reduce){
    .petal{ animation:none; display:none; }
    html{ scroll-behavior:auto; }
  }

  section{
    position:relative;
    z-index:2;
    padding:min(14vw,140px) 8vw;
  }

  /* ---------- hero ---------- */
  .hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding-top:8vh;
    padding-bottom:6vh;
  }

  .hero .bouquet{
    width:min(78vw,420px);
    margin-bottom:2.2rem;
    filter:drop-shadow(0 22px 30px rgba(90,30,45,.18));
  }

  .eyebrow{
    font-family:var(--body);
    font-style:italic;
    font-size:1.05rem;
    color:var(--rose-deep);
    letter-spacing:.02em;
    margin:0 0 .6rem;
  }

  h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(2.6rem,7vw,4.6rem);
    line-height:1.05;
    margin:0 0 1.1rem;
    color:var(--ink);
    max-width:16ch;
  }

  h1 em{
    font-style:italic;
    color:var(--rose-deep);
  }

  .lede{
    max-width:44ch;
    font-size:1.18rem;
    line-height:1.65;
    color:#4b3038;
  }

  .scroll-hint{
    margin-top:3rem;
    font-size:.95rem;
    color:#8a5c66;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.4rem;
  }
  .scroll-hint svg{ width:18px; height:18px; animation:bob 2.2s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(8px)} }

  /* ---------- note section ---------- */
  .note{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4rem;
    align-items:center;
    max-width:1100px;
    margin:0 auto;
  }
  .note h2{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(2rem,4vw,2.8rem);
    line-height:1.15;
    margin:0 0 1.2rem;
  }
  .note p{
    font-size:1.08rem;
    line-height:1.75;
    color:#4b3038;
    margin:0 0 1rem;
  }
  .note .rose-single{ width:100%; max-width:340px; justify-self:center; }

  @media (max-width:820px){
    .note{ grid-template-columns:1fr; text-align:center; gap:2rem; }
    .note .rose-single{ order:-1; max-width:240px; }
  }

  /* ---------- gallery ---------- */
  .gallery-head{
    text-align:center;
    max-width:640px;
    margin:0 auto 3.5rem;
  }
  .gallery-head h2{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(2rem,4vw,2.6rem);
    margin:0 0 .8rem;
  }
  .gallery-head p{
    font-size:1.05rem;
    color:#4b3038;
    line-height:1.6;
  }

  .rose-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:2.4rem;
    max-width:1100px;
    margin:0 auto;
  }
  @media (max-width:760px){
    .rose-grid{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:480px){
    .rose-grid{ grid-template-columns:1fr; }
  }

  .rose-card{
    background:var(--paper);
    border-radius:6px;
    padding:2rem 1.4rem 1.6rem;
    text-align:center;
    box-shadow:0 10px 26px rgba(90,30,45,.08);
    transition:transform .35s ease, box-shadow .35s ease;
  }
  .rose-card:hover{
    transform:translateY(-6px);
    box-shadow:0 18px 34px rgba(90,30,45,.14);
  }
  .rose-card svg{ width:100%; max-width:150px; height:auto; margin-bottom:1rem; }
  .rose-card .name{
    font-family:var(--serif);
    font-size:1.25rem;
    font-weight:600;
    margin-bottom:.3rem;
  }
  .rose-card .meaning{
    font-size:.92rem;
    color:#7a5560;
    font-style:italic;
  }

  /* ---------- letter section ---------- */
  .letter-wrap{
    max-width:640px;
    margin:0 auto;
    text-align:center;
  }
  .letter-wrap h2{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(2rem,4vw,2.7rem);
    margin:0 0 1rem;
  }
  .letter-wrap > p{
    color:#4b3038;
    font-size:1.05rem;
    margin-bottom:2.2rem;
  }

  .envelope-btn{
    font-family:var(--body);
    font-size:1.05rem;
    background:var(--rose-deep);
    color:var(--cream);
    border:none;
    padding:.95rem 2.1rem;
    border-radius:999px;
    cursor:pointer;
    letter-spacing:.02em;
    box-shadow:0 10px 22px rgba(163,50,74,.28);
    transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
  }
  .envelope-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 28px rgba(163,50,74,.34);
  }
  .envelope-btn:focus-visible{
    outline:3px solid var(--gold);
    outline-offset:3px;
  }

  .letter{
    margin-top:2.2rem;
    background:var(--paper);
    border-radius:8px;
    padding:2.6rem 2.2rem;
    text-align:left;
    font-family:var(--serif);
    font-size:1.25rem;
    line-height:1.7;
    color:#3a2129;
    box-shadow:0 16px 36px rgba(90,30,45,.14);
    max-height:0;
    opacity:0;
    overflow:hidden;
    transform:translateY(10px);
    transition:max-height .6s ease, opacity .5s ease, transform .5s ease, padding .6s ease, margin .6s ease;
  }
  .letter.open{
    max-height:600px;
    opacity:1;
    transform:translateY(0);
  }
  .letter .sign{
    margin-top:1.4rem;
    font-style:italic;
    color:var(--rose-deep);
  }

  /* ---------- footer ---------- */
  footer{
    text-align:center;
    padding:3rem 8vw 4rem;
    font-size:.9rem;
    color:#9a6c76;
  }
  footer .heart{ color:var(--rose-deep); }
</style>
</head>
<body>

<div class="lang-switch" role="group" aria-label="Language selector">
  <button type="button" id="btnEn" class="active">EN</button>
  <button type="button" id="btnTr">TR</button>
</div>

<div class="petal-field" id="petalField" aria-hidden="true"></div>

<section class="hero">
  <svg class="bouquet" viewBox="0 0 420 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A bouquet of hand drawn roses">
    <defs>
      <radialGradient id="petalGradA" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#f2b9c4"/>
        <stop offset="60%" stop-color="#c9506a"/>
        <stop offset="100%" stop-color="#8f2c44"/>
      </radialGradient>
      <radialGradient id="petalGradB" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#f7cfd7"/>
        <stop offset="60%" stop-color="#d9748a"/>
        <stop offset="100%" stop-color="#a3324a"/>
      </radialGradient>
      <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#527a62"/>
        <stop offset="100%" stop-color="#2f4f3e"/>
      </linearGradient>
    </defs>

    <!-- wrap -->
    <path d="M120 300 L210 460 L300 300 Z" fill="#f4ede4" stroke="#c9a367" stroke-width="2"/>

    <!-- stems -->
    <path d="M210 300 C205 340 208 380 210 420" stroke="#4c7059" stroke-width="4" fill="none"/>
    <path d="M170 300 C168 335 178 365 195 400" stroke="#4c7059" stroke-width="4" fill="none"/>
    <path d="M250 300 C252 335 244 365 226 400" stroke="#4c7059" stroke-width="4" fill="none"/>

    <!-- leaves -->
    <path d="M180 330 C150 320 140 300 150 280 C175 290 185 310 180 330 Z" fill="url(#leafGrad)"/>
    <path d="M240 330 C270 320 280 300 270 280 C245 290 235 310 240 330 Z" fill="url(#leafGrad)"/>

    <!-- rose 1 (center, large) -->
    <g transform="translate(210,190)">
      <circle r="70" fill="url(#petalGradA)"/>
      <path d="M0 -55 C30 -45 45 -15 30 15 C15 40 -20 45 -40 25 C-55 8 -50 -25 -25 -45 C-15 -52 -8 -55 0 -55 Z" fill="#8f2c44" opacity=".55"/>
      <path d="M0 -30 C18 -24 26 -6 16 10 C6 24 -12 26 -22 14 C-30 4 -26 -14 -12 -26 C-8 -29 -4 -30 0 -30 Z" fill="#f7dbe0" opacity=".8"/>
    </g>

    <!-- rose 2 (left) -->
    <g transform="translate(120,220) rotate(-12)">
      <circle r="46" fill="url(#petalGradB)"/>
      <path d="M0 -36 C20 -30 30 -10 20 10 C10 26 -14 30 -26 16 C-36 5 -33 -17 -16 -30 C-11 -34 -6 -36 0 -36 Z" fill="#7a2740" opacity=".5"/>
    </g>

    <!-- rose 3 (right) -->
    <g transform="translate(300,220) rotate(12)">
      <circle r="46" fill="url(#petalGradB)"/>
      <path d="M0 -36 C20 -30 30 -10 20 10 C10 26 -14 30 -26 16 C-36 5 -33 -17 -16 -30 C-11 -34 -6 -36 0 -36 Z" fill="#7a2740" opacity=".5"/>
    </g>

    <!-- baby's breath dots -->
    <g fill="#fbf1ea" stroke="#e3c9cf">
      <circle cx="80" cy="180" r="4"/>
      <circle cx="95" cy="160" r="4"/>
      <circle cx="330" cy="185" r="4"/>
      <circle cx="345" cy="165" r="4"/>
      <circle cx="210" cy="90" r="4"/>
      <circle cx="225" cy="105" r="4"/>
    </g>
  </svg>

  <p class="eyebrow" data-i18n="eyebrow"></p>
  <h1 data-i18n="h1"></h1>
  <p class="lede" data-i18n="lede"></p>

  <div class="scroll-hint">
    <span data-i18n="scrollHint"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
  </div>
</section>

<section class="note">
  <div>
    <h2 data-i18n="noteH2"></h2>
    <p data-i18n="noteP1"></p>
    <p data-i18n="noteP2"></p>
  </div>
  <svg class="rose-single" viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A single rose on a stem">
    <path d="M150 180 C145 230 150 280 152 320" stroke="#4c7059" stroke-width="5" fill="none"/>
    <path d="M150 230 C120 222 108 200 118 178 C144 188 154 208 150 230 Z" fill="#3f6350"/>
    <path d="M152 250 C182 242 194 220 184 198 C158 208 148 228 152 250 Z" fill="#33503f"/>
    <g transform="translate(150,110)">
      <circle r="88" fill="url(#petalGradA)"/>
      <path d="M0 -70 C38 -58 56 -20 38 18 C20 50 -26 56 -50 32 C-70 10 -64 -32 -32 -58 C-20 -66 -10 -70 0 -70 Z" fill="#8f2c44" opacity=".5"/>
      <path d="M0 -38 C22 -30 32 -8 20 12 C8 30 -16 33 -28 18 C-38 6 -34 -18 -16 -32 C-10 -36 -5 -38 0 -38 Z" fill="#f7dbe0" opacity=".85"/>
    </g>
  </svg>
</section>

<section class="gallery">
  <div class="gallery-head">
    <h2 data-i18n="galleryH2"></h2>
    <p data-i18n="galleryP"></p>
  </div>

  <div class="rose-grid" id="roseGrid"></div>
</section>

<section class="letter-section">
  <div class="letter-wrap">
    <h2 data-i18n="letterH2"></h2>
    <p data-i18n="letterP"></p>
    <button class="envelope-btn" id="openLetter" aria-expanded="false" aria-controls="letterBox"></button>
    <div class="letter" id="letterBox">
      <p data-i18n="letterBody1"></p>
      <p data-i18n="letterBody2"></p>
      <p data-i18n="letterBody3"></p>
      <p class="sign" data-i18n="letterSign"></p>
    </div>
  </div>
</section>

<footer data-i18n="footer"></footer>

<script>
  // ---------- translations ----------
  const dict = {
    en: {
      title: 'For Elif, from Numan',
      eyebrow: 'a small delivery, just because',
      h1: 'Numan brought roses today, <em>Elif</em>.',
      lede: 'Every stem was chosen slowly and on purpose &mdash; the way he thinks about you. Scroll down to see them all, and to open the note tucked between the petals.',
      scrollHint: 'keep going',
      noteH2: 'Why roses, why today',
      noteP1: "There isn't a special occasion written on the calendar. Numan just wanted Elif to open her door, or her phone, and find something soft waiting for her in the middle of an ordinary day.",
      noteP2: "Roses don't need a reason. Neither does this.",
      galleryH2: 'Six roses for six reasons',
      galleryP: 'Numan picked a small bouquet, and every rose in it means something slightly different.',
      letterH2: "There's a note in the wrapping",
      letterP: 'Elif always checks. This time there really is one.',
      openBtn: 'Open the note',
      closeBtn: 'Fold the note back up',
      letterBody1: 'Elif,',
      letterBody2: 'I keep noticing small things that remind me of you, and today it was the roses outside the corner shop, so I bought them before I could talk myself out of it.',
      letterBody3: 'No occasion. No reason. Just you, on an ordinary day, getting flowers anyway.',
      letterSign: 'Yours, Numan',
      footer: 'made with a little \u2764 &mdash; for Elif, from Numan',
      roses: [
        { name: 'Deep Red', meaning: 'for how sure he is about this' },
        { name: 'Blush Pink', meaning: 'for the shy part of asking her out' },
        { name: 'Warm Yellow', meaning: 'for making her laugh on bad days' },
        { name: 'Soft White', meaning: 'for starting over, gently' },
        { name: 'Lilac', meaning: 'for the things he hasn\u2019t said yet' },
        { name: 'Coral', meaning: 'for choosing her, again, today' }
      ]
    },
    tr: {
      title: 'Elif\u2019e, Numan\u2019dan',
      eyebrow: 'basit bir teslimat, sebepsiz yere',
      h1: 'Numan bugün <em>Elif</em>\u2019e gül getirdi.',
      lede: 'Her bir dal yavaşça ve bilerek seçildi &mdash; tıpkı seni düşündüğü gibi. Hepsini görmek ve yaprakların arasına sıkıştırılmış notu okumak için aşağı kaydır.',
      scrollHint: 'devam et',
      noteH2: 'Neden gül, neden bugün',
      noteP1: 'Takvimde yazan özel bir gün yok. Numan sadece Elif kapıyı ya da telefonunu açtığında, sıradan bir günün ortasında onu bekleyen yumuşak bir şey bulsun istedi.',
      noteP2: 'Güllerin bir sebebe ihtiyacı yok. Bunun da yok.',
      galleryH2: 'Altı gül, altı sebep',
      galleryP: 'Numan küçük bir buket seçti ve içindeki her gül biraz farklı bir anlam taşıyor.',
      letterH2: 'Paketin içinde bir not var',
      letterP: 'Elif her zaman bakar. Bu sefer gerçekten bir tane var.',
      openBtn: 'Notu aç',
      closeBtn: 'Notu tekrar katla',
      letterBody1: 'Elif,',
      letterBody2: 'Beni sana hatırlatan küçük şeyleri fark etmeye devam ediyorum, bugün de köşedeki dükkanın önündeki güllerdi; kendimi vazgeçirmeden önce aldım.',
      letterBody3: 'Özel bir gün yok. Sebep de yok. Sadece sen, sıradan bir günde, yine de çiçek alan sen.',
      letterSign: 'Seninle, Numan',
      footer: 'biraz \u2764 ile yapıldı &mdash; Elif\u2019e, Numan\u2019dan',
      roses: [
        { name: 'Koyu Kırmızı', meaning: 'bundan ne kadar emin olduğu için' },
        { name: 'Pudra Pembesi', meaning: 'ona çıkma teklif etmenin çekingen tarafı için' },
        { name: 'Sıcak Sarı', meaning: 'kötü günlerinde onu güldürmek için' },
        { name: 'Yumuşak Beyaz', meaning: 'yeniden, nazikçe başlamak için' },
        { name: 'Leylak', meaning: 'henüz söylemediği şeyler için' },
        { name: 'Mercan', meaning: 'onu bugün yine seçtiği için' }
      ]
    }
  };

  let currentLang = 'en';
  const roseColors = [
    { color: '#a3324a', dark: '#7a2740' },
    { color: '#e98da0', dark: '#c9506a' },
    { color: '#f2c744', dark: '#c99a1f' },
    { color: '#f4f1ea', dark: '#cfc6b4' },
    { color: '#d98fd1', dark: '#a75b9f' },
    { color: '#e2745a', dark: '#b84e37' }
  ];

  const grid = document.getElementById('roseGrid');
  const btn = document.getElementById('openLetter');
  const letter = document.getElementById('letterBox');

  function renderRoses(lang){
    const roses = dict[lang].roses;
    grid.innerHTML = '';
    roses.forEach((r, i) => {
      const c = roseColors[i];
      const card = document.createElement('div');
      card.className = 'rose-card';
      card.innerHTML = `
        <svg viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${r.name}">
          <path d="M70 90 C67 115 70 138 71 155" stroke="#4c7059" stroke-width="4" fill="none"/>
          <path d="M70 112 C52 106 45 92 51 79 C67 86 73 99 70 112 Z" fill="#3f6350"/>
          <g transform="translate(70,52)">
            <circle r="40" fill="${c.color}"/>
            <path d="M0 -32 C17 -26 25 -9 17 8 C9 22 -12 25 -22 14 C-32 4 -29 -14 -14 -26 C-9 -30 -4 -32 0 -32 Z" fill="${c.dark}" opacity=".55"/>
          </g>
        </svg>
        <div class="name">${r.name}</div>
        <div class="meaning">${r.meaning}</div>
      `;
      grid.appendChild(card);
    });
  }

  function applyLang(lang){
    currentLang = lang;
    document.documentElement.lang = lang;
    document.title = dict[lang].title;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (dict[lang][key] !== undefined) el.innerHTML = dict[lang][key];
    });
    const isOpen = letter.classList.contains('open');
    btn.textContent = isOpen ? dict[lang].closeBtn : dict[lang].openBtn;
    renderRoses(lang);
    document.getElementById('btnEn').classList.toggle('active', lang === 'en');
    document.getElementById('btnTr').classList.toggle('active', lang === 'tr');
  }

  document.getElementById('btnEn').addEventListener('click', () => applyLang('en'));
  document.getElementById('btnTr').addEventListener('click', () => applyLang('tr'));

  applyLang('en');

  // ---------- falling petals ----------
  const field = document.getElementById('petalField');
  const petalCount = window.innerWidth < 600 ? 14 : 26;
  for (let i = 0; i < petalCount; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    const left = Math.random() * 100;
    const size = 8 + Math.random() * 10;
    const duration = 9 + Math.random() * 10;
    const delay = Math.random() * 12;
    const drift = (Math.random() * 120 - 60) + 'px';
    const hueShift = Math.random() > .5 ? '#e98da0' : '#c9506a';
    p.style.left = left + 'vw';
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.background = hueShift;
    p.style.animationDuration = duration + 's';
    p.style.animationDelay = delay + 's';
    p.style.setProperty('--drift', drift);
    field.appendChild(p);
  }

  // ---------- letter toggle ----------
  btn.addEventListener('click', () => {
    const isOpen = letter.classList.toggle('open');
    btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    btn.textContent = isOpen ? dict[currentLang].closeBtn : dict[currentLang].openBtn;
    letter.style.marginTop = isOpen ? '2.2rem' : '0';
  });
</script>

</body>
</html>
